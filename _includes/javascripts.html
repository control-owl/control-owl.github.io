<script>
  (function () {
    function padHero() {
      var hero = document.querySelector('.article-image');
      var content = document.querySelector('.post-content');
      if (hero && content) {
        content.style.paddingTop = hero.offsetHeight + 'px';
      }
    }

    function parallax() {
      var images = document.querySelectorAll('.post-image-image, .teaserimage-image');
      if (!images.length) return;
      var top = window.scrollY || window.pageYOffset;
      if (top < 0 || top > 1500) return;
      var opacity = 1 - Math.max(top / 700, 0);
      var y = top / 3;
      for (var i = 0; i < images.length; i++) {
        images[i].style.transform = 'translate3d(0,' + y + 'px,0)';
        images[i].style.opacity = opacity;
      }
    }

    function readingTime() {
      var content = document.querySelector('.post-content');
      var target = document.querySelector('.post-reading-time');
      if (!content || !target) return;
      var text = content.innerText || content.textContent || '';
      var words = text.trim().split(/\s+/).filter(Boolean).length;
      var minutes = Math.max(1, Math.round(words / 200));
      target.textContent = minutes + ' min';
    }

    function onReady() {
      padHero();
      parallax();
      readingTime();
      window.addEventListener('scroll', parallax, { passive: true });
      window.addEventListener('resize', padHero);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', onReady);
    } else {
      onReady();
    }
  })();
</script>
